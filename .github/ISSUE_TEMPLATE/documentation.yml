name: 📚 Documentation
description: Signaler un problème ou suggérer une amélioration de la documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📖 Merci d'améliorer la documentation !
        
        Une bonne documentation est essentielle pour QSOS. Aidez-nous à l'améliorer en signalant les problèmes ou en suggérant des améliorations.
        
        **Note :** Les labels `documentation` et `needs-triage` seront automatiquement ajoutés.
        
  - type: dropdown
    id: doc-type
    attributes:
      label: Type de problème
      description: Quel type de problème de documentation ?
      options:
        - Documentation manquante
        - Documentation incorrecte ou obsolète
        - Documentation peu claire
        - Erreur de traduction
        - Suggestion d'amélioration
    validations:
      required: true

  - type: dropdown
    id: section
    attributes:
      label: Section concernée
      description: Quelle partie de la documentation est affectée ?
      options:
        - Guide de démarrage
        - Guide utilisateur
        - Guide développeur
        - API / Référence technique
        - Configuration / Déploiement
        - Internationalisation / Traductions
        - README / Fichiers racine
        - Autre
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Emplacement
      description: Où se trouve exactement le problème ?
      placeholder: Soyez aussi précis que possible
      value: |
        - URL: https://...
        - Fichier: docs/content/...
        - Section/Titre: ...
        - Ligne (si applicable): ...
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Description du problème
      description: Qu'est-ce qui ne va pas avec la documentation actuelle ?
      placeholder: Expliquez clairement le problème
      value: |
        <!-- Décrivez le problème ici -->
        
        **Problème actuel :**
        
        
        **Impact sur les utilisateurs :**
        
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion de correction
      description: Comment améliorer cette documentation ?
      placeholder: Proposez une solution ou une amélioration
      value: |
        <!-- Votre suggestion ici -->
        
        **Correction proposée :**
        
        
        **Contenu suggéré :**
        ```markdown
        <!-- Si vous avez un texte/code à proposer, mettez-le ici -->
        ```

  - type: textarea
    id: additional
    attributes:
      label: Contexte additionnel
      description: Informations supplémentaires (captures d'écran, exemples, références, etc.)
      placeholder: Ajoutez tout contexte utile

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Seriez-vous prêt(e) à contribuer à cette amélioration ?
      options:
        - label: Je suis prêt(e) à soumettre une Pull Request pour corriger cette documentation
          required: false