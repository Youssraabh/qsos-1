name: ✨ Feature Request
description: Proposer une nouvelle fonctionnalité pour QSOS
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Merci de proposer cette amélioration !
        
        Votre suggestion nous aide à améliorer QSOS. Décrivez votre idée en détail pour que nous puissions l'évaluer.
        
        **Note :** Les labels `enhancement` et `needs-triage` seront automatiquement ajoutés. Les mainteneurs ajouteront les labels de priorité et de catégorie appropriés.

  - type: dropdown
    id: type
    attributes:
      label: Type de fonctionnalité
      description: Quelle catégorie décrit le mieux cette fonctionnalité ?
      options:
        - Nouvelle fonctionnalité
        - Amélioration d'une fonctionnalité existante
        - Amélioration UX/UI
        - Amélioration de performance
        - Intégration / API
        - Documentation
        - Autre
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel problème ou besoin cette fonctionnalité adresserait-elle ?
      placeholder: Décrivez le contexte et le besoin
      value: |
        <!-- Exemple : Actuellement, il n'est pas possible de [faire X], ce qui rend difficile [Y]. -->
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez en détail la solution que vous aimeriez voir implémentée
      placeholder: Expliquez comment cette fonctionnalité devrait fonctionner
      value: |
        <!-- Décrivez votre solution idéale ici -->
        
        **Fonctionnement proposé :**
        - 
        
        **Interface/UX proposée :**
        - 
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
      description: Avez-vous envisagé d'autres solutions ou approches ?
      placeholder: Une alternative serait de [...]

  - type: textarea
    id: additional
    attributes:
      label: Contexte additionnel
      description: Ajoutez tout autre contexte, captures d'écran ou exemples concernant cette demande
      placeholder: |
        - Cas d'usage spécifiques
        - Exemples d'implémentation dans d'autres projets
        - Mockups ou schémas

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Seriez-vous prêt(e) à contribuer à cette fonctionnalité ?
      options:
        - label: Je suis prêt(e) à soumettre une Pull Request pour cette fonctionnalité
          required: false