name: 🐛 Bug Report
description: Signaler un bug dans QSOS
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 👋 Merci de signaler ce bug !
        
        Ce rapport nous aidera à identifier et corriger le problème. Remplissez toutes les sections requises avec le plus de détails possible.
        
        **Note :** Les labels `bug` et `needs-triage` seront automatiquement ajoutés. Les mainteneurs ajouteront les labels de priorité et de catégorie appropriés.

  - type: dropdown
    id: type
    attributes:
      label: Type de composant affecté
      description: Quelle partie de l'application est concernée ?
      options:
        - Frontend (Interface utilisateur)
        - Backend (API / Serveur)
        - Base de données
        - Documentation
        - DevOps / CI/CD
        - Authentification
        - Autre
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Décrivez clairement et de manière concise le bug rencontré
      placeholder: |
        Exemple : Lorsque je tente d'exporter une évaluation en PDF, l'application affiche une erreur 500 et le fichier n'est pas généré.
      value: |
        <!-- Décrivez le bug ici -->
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Listez les étapes exactes pour reproduire ce bug
      placeholder: Soyez aussi précis que possible
      value: |
        1. Aller à '...'
        2. Cliquer sur '...'
        3. Faire défiler jusqu'à '...'
        4. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Qu'aurait dû se passer ?
      placeholder: Décrivez clairement le comportement attendu
      value: |
        <!-- Ce qui devrait se passer -->
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel
      description: Que se passe-t-il réellement ?
      placeholder: Décrivez le comportement actuel (incorrect)
      value: |
        <!-- Ce qui se passe réellement -->
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Informations sur votre environnement d'exécution
      value: |
        - OS: [ex. Windows 11, macOS Sonoma, Ubuntu 22.04]
        - Node version: [ex. 20.11.0 - exécutez `node --version`]
        - Bun version (si applicable): [ex. 1.0.25 - exécutez `bun --version`]
        - Navigateur: [ex. Chrome 120, Firefox 121, Safari 17]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Messages d'erreur
      description: Copiez-collez les logs console, messages d'erreur ou stack traces
      render: shell
      placeholder: Collez les logs complets ici (n'hésitez pas à inclure le contexte)
      value: |
        ```
        <!-- Collez vos logs ici -->
        ```

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Si applicable, ajoutez des captures d'écran pour illustrer le problème
      placeholder: Glissez-déposez vos images ici

  - type: textarea
    id: additional
    attributes:
      label: Contexte additionnel
      description: Toute autre information pertinente (configuration spéciale, tentatives de résolution, etc.)
      placeholder: Informations supplémentaires qui pourraient aider
